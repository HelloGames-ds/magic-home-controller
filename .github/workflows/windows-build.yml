name: Windows build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/Magic-Home-Controller.exe package/Magic-Home-Controller.exe
          windeployqt --release --no-translations --compiler-runtime package/Magic-Home-Controller.exe
          # Переводы Qt нужны для русских системных диалогов (открыть файл и
          # подобные). --no-translations пропускает их, поэтому кладём qtbase_ru
          # явно: так установщик весит столько же, сколько локальная сборка.
          $qtTranslations = (qmake -query QT_INSTALL_TRANSLATIONS).Trim()
          if (-not $qtTranslations -or -not (Test-Path "$qtTranslations/qtbase_ru.qm")) {
            throw "qtbase_ru.qm not found (QT_INSTALL_TRANSLATIONS='$qtTranslations')"
          }
          New-Item -ItemType Directory -Force package/translations | Out-Null
          Copy-Item "$qtTranslations/qtbase_ru.qm" package/translations/qtbase_ru.qm

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Home-Controller-windows-x64
          path: package/

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          New-Item -ItemType Directory -Force dist-cpp | Out-Null
          Copy-Item package/* dist-cpp -Recurse -Force
          New-Item -ItemType Directory -Force dist-cpp/translations | Out-Null
          Copy-Item translations/magic_home_controller_ru.qm dist-cpp/translations/magic_home_controller_ru.qm
          Copy-Item translations/magic_home_controller_en.qm dist-cpp/translations/magic_home_controller_en.qm
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found: $iscc" }
          & $iscc "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Home-Controller-installer
          path: installer-output/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
      # Нужны для actions/attest-build-provenance: подпись provenance
      # выпускается через OIDC-токен, а сам attestation пишется отдельным API.
      id-token: write
      attestations: write
    steps:
      # Нужен именно здесь: `gh release create --generate-notes` собирает
      # заметки из истории git, а без checkout репозитория падал с
      # "failed to run git: not a git repository".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: Magic-Home-Controller-installer
          path: installer-output

      # Связывает установщик с коммитом и workflow, из которого он собран.
      # Подпись тега этого не покрывает: тег говорит, кто выпустил релиз,
      # а attestation — откуда именно взят .exe.
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: installer-output/*.exe

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $assets = @(Get-ChildItem installer-output/*.exe | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No installer assets found" }
          gh release create $tag @assets --generate-notes --title "Magic Home Controller $version"

      - name: Show verification summary
        if: always()
        shell: pwsh
        env:
          # gh работает с API только с токеном: без него шаг падал уже после
          # успешного создания релиза и ронял весь job впустую.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem installer-output/*.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "No installer to summarise"; exit 0 }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash.ToLower()
          Write-Host "Installer: $($exe.Name)"
          Write-Host "SHA256:    $hash"
          # Проверка информационная: релиз уже создан, и её неудача не должна
          # помечать успешный выпуск как упавший.
          gh attestation verify $exe.FullName --repo $env:GITHUB_REPOSITORY 2>&1 |
            Out-String | Write-Host
          exit 0
