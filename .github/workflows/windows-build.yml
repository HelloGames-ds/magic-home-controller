name: Windows build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/translations | Out-Null
          Copy-Item build/Release/Magic-Home-Controller.exe package/Magic-Home-Controller.exe
          windeployqt --release --no-translations --compiler-runtime package/Magic-Home-Controller.exe
          Copy-Item translations/magic_home_controller_ru.qm package/translations/

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Home-Controller-windows-x64
          path: package/